<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#242629"><title>Calda — Smart Home</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar"><div class="brand"><span class="brandmark">⌂</span><span class="brandname">Calda<small>22 Wren Terrace</small></span></div><nav id="nav"></nav><div class="sidebottom"><button id="help">? <span>Help & support</span></button><div class="profile"><span class="avatar">TB</span><span class="profiletext">Tobi B.<small>Home owner</small></span><span class="dots">•••</span></div></div></aside>
<main class="main"><header class="topbar"><button class="mobilebrand" id="menuBtn">☰　Calda</button><div class="topnav" id="topnav"></div><div class="toptools"><button id="searchBtn" title="Search">⌕</button><button id="quickAdd" title="Add">＋</button><button id="viewBtn" title="Layout">▥</button><button id="themeBtn" title="Theme">☼</button><button id="noticeBtn" title="Notifications">♧</button><span class="avatar">TB</span></div></header><section class="content" id="content"></section></main>
</div>
<div class="toast" id="toast"></div>
<div class="modalwrap" id="modal"><div class="modal"><button class="x" id="closeModal">×</button><h2 id="modalTitle">Add device</h2><p id="modalText">Connect a new smart home device.</p><form id="modalForm"><label>Name<input id="modalName" required placeholder="e.g. Kitchen light"></label><label>Room<select id="modalRoom"><option>Living room</option><option>Kitchen</option><option>Dining</option><option>Bedroom</option><option>Den</option></select></label><div class="modalfoot"><button type="button" class="ghost" id="cancelModal">Cancel</button><button class="primary">Save</button></div></form></div></div>
<script src="app.js"></script></body></html>
